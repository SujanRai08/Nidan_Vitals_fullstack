<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nidan Vitals Healthcare FullStack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>

<body class="bg-light">
    <div class="container mt-5">
        <h2 class="mb-4 text-primary">Nidan Vitals Dashboard</h2>
        <!-- vitals form  -->
        <div class="card mb-4 shadow-sm">
            <div class="card-body">
                <h5 class="card-title mb-3">New Vitals Entry</h5>
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">Patient ID</label>
                        <input type="text" id="patientId" class="form-control" placeholder="e.g. P-101">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Height (cm)</label>
                        <input type="number" id="height" class="form-control" placeholder="170">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Weight (kg)</label>
                        <input type="number" id="weight" class="form-control" placeholder="70">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Systolic</label>
                        <input type="number" id="systolic" class="form-control" placeholder="120">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Diastolic</label>
                        <input type="number" id="diastolic" class="form-control" placeholder="80">
                    </div>
                    <div class="col-md-8">
                        <div id="bmiDisplay" class="fw-bold p-2 rounded bmi-badge text-center border">
                            BMI: -- (Enter Height & Weight)
                        </div>
                    </div>
                    <div class="col-md-4">
                        <button id="saveBtn" class="btn btn-primary w-100 h-100">Save Record</button>
                    </div>
                </div>
            </div>

            <!-- Table -->

            <div class="card shadow-sm">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <input type="text" id="searchBar" class="form-control w-25" placeholder="Search Patient ID...">
                        <div class="btn-group">
                            <button class="btn btn-outline-secondary filter-btn active" data-risk="All">All</button>
                            <button class="btn btn-outline-success filter-btn" data-risk="Normal">Normal</button>
                            <button class="btn btn-outline-warning filter-btn"
                                data-risk="Overweight">Overweight</button>
                            <button class="btn btn-outline-danger filter-btn" data-risk="Obese">Obese</button>
                        </div>
                    </div>

                    <table class="table table-hover">
                        <thead class="table-light">
                            <tr>
                                <th>Patient ID</th>
                                <th>BMI</th>
                                <th>Category</th>
                                <th>Risk Status</th>
                                <th>Date</th>
                            </tr>
                        </thead>
                        <tbody id="vitalsTableBody">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
</body>

</html>
