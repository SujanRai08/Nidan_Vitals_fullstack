<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nidan Vitals Healthcare FullStack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container mt-5">
        <h2 class="mb-4 text-primary">Nidan Vitals Dashboard</h2>
        <!-- vitals form  -->
        <div class="card mb-4">
            <div class="card-body">
                <h5 class="mb-3">Add vitals</h5>
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">Patient Id</label>
                        <input id="patientId" type="text" class="form-control">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Height (cm)</label>
                        <input id="height" class="form-control" type="number">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Weight (kg)</label>
                        <input id="weight" class="form-control" type="number">
                    </div>

                    <div class="col-md-2">
                        <label class="form-label">Systolic</label>
                        <input id="systolic" class="form-control" type="number">
                    </div>

                    <div class="col-md-2">
                        <label class="form-label">Diastolic</label>
                        <input id="diastolic" class="form-control" type="number">
                    </div>
                </div>
                <div class="mt-3">
                    <div class="border p-2 rounded" id="bmiDisplay">
                        BMI: --
                    </div>
                </div>
                <button id="saveBtn" class="btn btn-primary mt-3">
                    Save
                </button>
            </div>
        </div>
        <!-- Table -->
        <div class="card">
            <div class="card-body">

                <h5 class="mb-3">Vitals Records</h5>

                <table class="table table-bordered">
                    <thead>
                        <tr>
                            <th>Patient ID</th>
                            <th>BMI</th>
                            <th>Category</th>
                            <th>Date</th>
                        </tr>
                    </thead>
                    <tbody id="vitalsTableBody">
                        <!-- Rows injected by JS -->
                    </tbody>
                </table>

            </div>
        </div>
        <script src="script.js"></script>
</body>
</html>
